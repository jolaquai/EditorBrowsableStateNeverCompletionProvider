name: Build & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # required to create releases / upload assets

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # VSIX projects (Microsoft.VSSDK.BuildTools) need full MSBuild from
      # Visual Studio, not the `dotnet` CLI. windows-latest ships VS 2022.
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: msbuild EditorBrowsableStateNeverCompletionProvider/EditorBrowsableStateNeverCompletionProvider.csproj -t:Restore -p:Configuration=Release

      - name: Build
        run: msbuild EditorBrowsableStateNeverCompletionProvider/EditorBrowsableStateNeverCompletionProvider.csproj -t:Rebuild -p:Configuration=Release -p:DeployExtension=false

      - name: Locate VSIX
        id: vsix
        shell: pwsh
        run: |
          $vsix = Get-ChildItem -Path EditorBrowsableStateNeverCompletionProvider/bin/Release -Recurse -Filter *.vsix | Select-Object -First 1
          if (-not $vsix) { throw "No .vsix produced by the build." }
          "path=$($vsix.FullName)" >> $env:GITHUB_OUTPUT
          Write-Host "Found VSIX: $($vsix.FullName)"

      # The .csproj <Version> is the single source of truth: it's what the VSIX
      # manifest is stamped with, and it's what the release tag tracks.
      - name: Read version
        id: ver
        shell: pwsh
        run: |
          [xml]$p = Get-Content EditorBrowsableStateNeverCompletionProvider/EditorBrowsableStateNeverCompletionProvider.csproj
          $v = ($p.Project.PropertyGroup.Version | Where-Object { $_ }) | Select-Object -First 1
          if (-not $v) { throw "No <Version> found in the .csproj." }
          $v = "$v".Trim()
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=v$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v -> tag v$v"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: ${{ steps.vsix.outputs.path }}
          if-no-files-found: error

      # A release is cut only when <Version> is bumped to something not yet tagged.
      # Pushes that don't change the version build + upload the artifact but skip
      # the release (re-tagging an existing version would clobber the release).
      - name: Check whether tag already exists
        id: tagcheck
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          git fetch --tags --quiet
          $exists = (git tag --list "${{ steps.ver.outputs.tag }}")
          if ($exists) {
            Write-Host "Tag ${{ steps.ver.outputs.tag }} already exists - skipping release."
            "exists=true" >> $env:GITHUB_OUTPUT
          } else {
            "exists=false" >> $env:GITHUB_OUTPUT
          }

      # Only publish on pushes to main (merged PRs / direct pushes) for a new version,
      # never on pull_request validation runs.
      - name: Create Release
        if: github.event_name != 'pull_request' && steps.tagcheck.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: ${{ steps.vsix.outputs.path }}
